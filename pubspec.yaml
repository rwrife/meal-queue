name: mealqueue
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  fluent_ui: ^4.17.0
  flutter:
    sdk: flutter
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  share_plus: ^11.1.0
  path: ^1.9.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: AppStore/icon.png
  android: true
  ios: true
  windows:
    generate: true
    image_path: AppStore/icon.png
    icon_size: 48
  adaptive_icon_background: "#F27A51"
  adaptive_icon_foreground: AppStore/icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
